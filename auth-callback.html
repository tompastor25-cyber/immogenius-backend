<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification en cours... - Immo Genius</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    .spinner {
      border: 4px solid var(--light-bg);
      border-top: 4px solid var(--secondary);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 18px;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="loading-container">
    <div class="spinner"></div>
    <p class="loading-text">Authentification en cours...</p>
    <p style="color: var(--text-light); font-size: 14px;">Veuillez patienter quelques secondes...</p>
  </div>

  <script>
    /**
     * Page de callback OAuth
     * Traite la réponse du fournisseur OAuth et complète l'authentification
     */

    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const provider = params.get('provider'); // 'google' ou 'microsoft'
      const error = params.get('error');

      if (error) {
        handleAuthError(error);
        return;
      }

      if (!code || !provider) {
        handleAuthError('Code ou provider manquant');
        return;
      }

      // Appeler le backend pour échanger le code contre un token
      exchangeCodeForToken(code, provider);
    });

    /**
     * Échange le code OAuth contre un token JWT
     */
    function exchangeCodeForToken(code, provider) {
      // En production: appeler votre backend
      // POST /api/auth/oauth/callback
      // Body: { code, provider }

      console.log(`[OAUTH CALLBACK] Provider: ${provider}, Code reçu`);

      // Simulation (en prod, remplacer par appel API)
      setTimeout(() => {
        const mockUser = {
          id: 'user_' + Math.random().toString(36).substr(2, 9),
          email: 'utilisateur@' + provider + '.com',
          name: 'Utilisateur ' + provider,
          provider: provider,
          createdAt: new Date().toISOString()
        };

        const mockToken = 'jwt_token_' + Math.random().toString(36).substr(2, 20);

        // Sauvegarder le token
        localStorage.setItem('authToken', mockToken);
        localStorage.setItem('user', JSON.stringify(mockUser));

        console.log('[OAUTH SUCCESS]', mockUser);

        // Rediriger vers la page d'accueil ou dashboard
        window.location.href = '/';
      }, 2000);
    }

    /**
     * Gère les erreurs d'authentification
     */
    function handleAuthError(error) {
      console.error('[OAUTH ERROR]', error);

      document.querySelector('.loading-container').innerHTML = `
        <div style="text-align: center;">
          <h2 style="color: var(--primary); margin-bottom: 16px;">Authentification échouée</h2>
          <p style="color: var(--text-light); margin-bottom: 24px;">
            Erreur: <strong>${error}</strong>
          </p>
          <p style="color: var(--text-light); margin-bottom: 32px;">
            Veuillez réessayer ou utiliser l'authentification par email/mot de passe.
          </p>
          <a href="/auth" class="btn btn-primary">Retour à l'authentification</a>
        </div>
      `;
    }
  </script>

</body>
</html>
